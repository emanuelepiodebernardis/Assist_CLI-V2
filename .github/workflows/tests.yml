# CI: esegue l'intera suite pytest a ogni push e PR.
# Il badge nel README punta a questo workflow.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Installa dipendenze Python
        run: |
          pip install -e .
          pip install pytest pytest-cov coverage hypothesis \
            anthropic python-dotenv pyyaml ruff

      - name: Prepara template TypeScript (vitest + fast-check)
        run: |
          mkdir -p /tmp/ts_template
          cd /tmp/ts_template
          npm init -y > /dev/null
          npm install vitest fast-check typescript \
            --no-audit --no-fund

      - name: Lint (moduli di produzione)
        run: |
          python -m ruff check assist/verification assist/cli \
            assist/llm assist/utils assist/schemas

      - name: Test
        run: python -m pytest tests/ -q
        env:
          ASSIST_TS_TEMPLATE: /tmp/ts_template

      - name: Benchmark (solo validazione strutturale)
        run: python -m pytest tests/unit/verification/test_benchmark.py -q
